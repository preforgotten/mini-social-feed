[workspace]
members = ["crates/domain", "crates/application", "crates/data", "crates/infra", "crates/server", "demo"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"

[package]
name = "mini-social-feed"
version.workspace = true
edition.workspace = true

[dependencies]
mini-social-feed-domain = { path = "crates/domain" }
mini-social-feed-app = { path = "crates/application" }
mini-social-feed-data = { path = "crates/data" }
mini-social-feed-infra = { path = "crates/infra" }
mini-social-feed-server = { path = "crates/server" }
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
reqwest = { version = "0.12", features = ["json", "multipart"] }
serde_json = "1"
chrono = "0.4"
hex = "0.4"
sha2 = "0.10"
k256 = { version = "0.13", features = ["ecdsa"] }
rand_core = "0.6"
