[package]
name = "mini-social-feed-server"
version.workspace = true
edition.workspace = true

[dependencies]
mini-social-feed-domain = { path = "../domain" }
mini-social-feed-app = { path = "../application" }
mini-social-feed-data = { path = "../data" }
mini-social-feed-infra = { path = "../infra" }
axum = { version = "0.7", features = ["multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }
base64 = "0.22"
thiserror = "1"
tracing = "0.1"
hex = "0.4"
sha2 = "0.10"
chrono = "0.4"
futures = "0.3"
tokio-stream = "0.1"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
