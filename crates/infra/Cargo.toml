[package]
name = "mini-social-feed-infra"
version.workspace = true
edition.workspace = true

[dependencies]
mini-social-feed-domain = { path = "../domain" }
mini-social-feed-app = { path = "../application" }
mini-social-feed-data = { path = "../data" }
k256 = { version = "0.13", features = ["ecdsa"] }
hex = "0.4"
rand_core = "0.6"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
jsonwebtoken = "9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["sync", "rt", "macros"] }
async-trait = "0.1"
thiserror = "1"
argon2 = "0.5"
